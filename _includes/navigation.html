<nav class="site-nav" aria-label="Main navigation">
  <ul>
    {% for item in site.navigation %}
      {% assign item_url = item.url | relative_url %}
      <li>
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url == item_url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
